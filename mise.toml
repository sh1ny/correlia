# Toolchain for correlia. Always run tools through mise (`mise run <task>` or
# `mise exec -- <cmd>`), never a dart/flutter from PATH.
#
# Flutter 3.47.9 bundles Dart 3.13.7 (patched for GHSA-frr6-h895-5pxp).
# Serverpod 4.x needs Flutter >= 3.44.4 / Dart >= 3.12.2.
# The Serverpod CLI (serverpod_cli 4.1.x) is installed by the M0 change
# `bootstrap-workspace`, which also adds the analyze/test/format tasks and the
# WSL test runner. Until then only the planning tasks below exist.

[tools]
flutter = "3.47.9"
node = "24"

[tasks.check]
description = "Pre-push gate (pr.validate). Today: OpenSpec validation only; M0 adds analyze + fast tests"
run = "openspec validate --all --strict"

[tasks."spec:validate"]
description = "Validate every OpenSpec spec and change"
run = "openspec validate --all --strict"

[tasks."spec:list"]
description = "List OpenSpec changes"
run = "openspec list"
