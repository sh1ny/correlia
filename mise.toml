[tools]
python = "3.14.7"
uv = "0.11.7"

[env]
UV_PYTHON = { value = "{{ tools.python.path }}/{% if os() == 'windows' %}python.exe{% else %}bin/python3{% endif %}", tools = true }
UV_PYTHON_DOWNLOADS = "never"

[tasks.setup]
description = "Synchronize the exact locked development environment"
run = "python scripts/verification.py setup -- uv --no-config sync --locked --group dev"

[tasks."format:check"]
description = "Check Python formatting without rewriting files"
depends = ["setup"]
run = "python scripts/verification.py format:check -- uv --no-config run --locked --no-sync ruff format --check ."

[tasks.lint]
description = "Check Python lint"
depends = ["setup"]
run = "python scripts/verification.py lint -- uv --no-config run --locked --no-sync ruff check ."

[tasks.typecheck]
description = "Check strict application types"
depends = ["setup"]
run = "python scripts/verification.py typecheck -- uv --no-config run --locked --no-sync mypy app"

[tasks.run]
description = "Start the local factory server using explicitly exported settings"
depends = ["setup"]
run = "uv --no-config run --locked --no-sync uvicorn app.main:create_app --factory --reload"

[tasks.audit]
description = "Fail on dependency advisories or scanner/service errors; no exceptions"
depends = ["setup"]
run = "python scripts/verification.py audit -- uv --no-config --preview-features audit audit --locked"

[tasks.test]
description = "Full Linux verification including real PostgreSQL, POSIX and Compose"
depends = ["setup"]
wait_for = ["format:check", "lint", "typecheck", "audit"]
run = "python scripts/verification.py test -- uv --no-config run --locked --no-sync pytest --verification-mode=full"

[tasks."test:deployment"]
description = "Run only the required real Compose/Mailpit deployment scenario"
depends = ["setup"]
run = "python scripts/verification.py test:deployment -- uv --no-config run --locked --no-sync pytest --verification-mode=deployment"

[tasks."test:portable"]
description = "Portable development subset; not Linux or deployment verification"
depends = ["setup"]
wait_for = ["format:check", "lint", "typecheck", "audit"]
run = "python scripts/verification.py test:portable -- uv --no-config run --locked --no-sync pytest --verification-mode=portable"

[tasks.ci]
description = "Required Linux gate; each check and deployment smoke runs once"
depends = ["format:check", "lint", "typecheck", "audit", "test"]

[tasks."check:portable"]
description = "Windows-compatible development checks; not full verification"
depends = ["format:check", "lint", "typecheck", "audit", "test:portable"]

[tasks."clean:verification"]
description = "Remove only the identified verification project's Docker resources"
run = "python scripts/cleanup_verification.py"
