/*
 * Correlia helper functions. Not edited by the operator; loaded by correlia.conf.
 *
 * Every value reaches the sender's command line as one ASCII JSON string literal, so no raw text, NUL or
 * invalid UTF-8 enters argv. Each helper uses only Icinga 2's native string operations, with no loop over the
 * bytes: Json.encode, replace, substr and len each run in C++ and are linear in the input.
 *
 * Json.encode repairs invalid UTF-8 and writes every non-ASCII and control character, NUL included, as a \u
 * escape. The dollar sign is then rewritten as \u0024, so the result holds no dollar sign and Icinga 2's
 * macro processor, which expands the result of an argument function again, has nothing to change.
 */

const CorreliaTruncationMarker = "…[truncated by correlia]"

/* Limits, in bytes of the unescaped value. */
const CorreliaTextLimit = 8192
const CorreliaAuthorLimit = 1024
const CorreliaNameLimit = 1024
const CorreliaSettingLimit = 4096

/* The JSON literal of the empty string: what the sender reads as "no usable value". */
const CorreliaEmptyLiteral = "\"\""

/*
 * Display text (check output, author, comment). A value that is not a string, or is empty, gives "" and the
 * argument's set_if omits it. A longer value is cut once at `limit` bytes and gets the marker. A cut through a
 * multibyte character leaves at most one U+FFFD before the marker.
 */
globals.correlia_text = function(value, limit) {
  if (typeof(value) != String || value.len() == 0) {
    return ""
  }
  var text = value
  if (value.len() > limit) {
    text = value.substr(0, limit) + CorreliaTruncationMarker
  }
  return Json.encode(text).replace("$", "\\u0024")
}

/*
 * Names, base URL, file paths: delivered exactly or not at all. Returns the encoded literal only when the value
 * is a non-empty string of at most `limit` bytes that survives Json.encode unchanged (which fails exactly when
 * the encoder repaired invalid UTF-8). Otherwise it returns the literal "" (two quote characters), which the
 * sender refuses with exit 2 naming the argument.
 */
globals.correlia_exact = function(value, limit) {
  if (typeof(value) != String || value.len() == 0 || value.len() > limit) {
    return CorreliaEmptyLiteral
  }
  var encoded = Json.encode(value)
  if (Json.decode(encoded) != value) {
    return CorreliaEmptyLiteral
  }
  return encoded.replace("$", "\\u0024")
}

/*
 * The sender path as a `command` element. Icinga 2 expands macros in the command array itself, where "$$" is
 * one literal dollar sign, so doubling every dollar sign keeps the configured path exactly.
 *
 * Icinga 2 hands each element to the operating system as a C string, which ends at the first NUL: a path holding
 * one would run whatever file its prefix names. Such a path, like a value that is not a non-empty string, gives
 * "" instead, which no file is called, so the command fails (env exits 127) and nothing is sent. Json.encode
 * writes a NUL as \u0000; dropping each escaped backslash pair first keeps a literal backslash followed by
 * "u0000" from looking like one.
 */
globals.correlia_command_path = function(value) {
  if (typeof(value) != String || value.len() == 0 ||
      Json.encode(value).replace("\\\\", "").contains("\\u0000")) {
    return ""
  }
  return value.replace("$", "$$")
}

/* The base URL: a scheme and an authority only. \A and \z anchor the buffer (Boost's ^ and $ match at line breaks). */
globals.correlia_base_url = function(value) {
  if (typeof(value) != String || !regex("\\Ahttps?://[A-Za-z0-9.:\\[\\]-]+\\z", value)) {
    return CorreliaEmptyLiteral
  }
  return correlia_exact(value, CorreliaSettingLimit)
}

/* The source id: a lowercase UUID. */
globals.correlia_source = function(value) {
  if (typeof(value) != String ||
      !regex("\\A[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\\z", value)) {
    return CorreliaEmptyLiteral
  }
  return correlia_exact(value, CorreliaSettingLimit)
}

/*
 * Unix seconds (an Icinga 2 double) as a fixed six-decimal string, "1763571234.123457", exact to the
 * microsecond. A double holds about 15 significant digits, so the value is converted to an integer count of
 * microseconds first (Math.round of seconds * 1000000, an integer below 2^53), and the two halves are then
 * split and formatted with integer arithmetic. No decimal text of the double is ever parsed or printed.
 *
 * Range: 1 <= seconds < 2^32 (4294967296, the year 2106). Below 2^32 a double resolves at least 0.48 us, so
 * the nearest double of any microsecond value rounds back to that same microsecond; from 2^33 on, doubles are
 * coarser than a microsecond. Anything outside the range, or not a number, gives "" (the sender then refuses it).
 */
globals.correlia_time_text = function(seconds) {
  if (typeof(seconds) != Number || !(seconds >= 1) || !(seconds < 4294967296)) {
    return ""
  }
  var micros = Math.round(seconds * 1000000)
  var whole = Math.floor(micros / 1000000)
  var fraction = String(micros - whole * 1000000)
  return String(whole) + "." + "000000".substr(0, 6 - fraction.len()) + fraction
}

/* The time as the JSON string literal the sender expects (no usable time gives the empty literal, which it refuses). */
globals.correlia_time_literal = function(seconds) {
  return Json.encode(correlia_time_text(seconds))
}

/* The latest check output of a live host or service object, or "" before its first result. */
globals.correlia_live_output = function(target) {
  if (target == null || target.last_check_result == null) {
    return ""
  }
  return target.last_check_result.output
}

/*
 * Whether Icinga 2 has recorded a result that changed the object's state value (design D13). Every checkable
 * starts as UNKNOWN (a host: DOWN), and Icinga 2 records each result's time in a per-state attribute that stays 0
 * until such a result arrives, so a host has changed state value exactly when last_state_up is not 0, and a
 * service exactly when last_state_ok, last_state_warning or last_state_critical is not 0. The test is for a
 * recorded result, not for a valid time: a passive result with a negative execution end still counts.
 */
globals.correlia_nonzero = function(value) {
  return typeof(value) == Number && value != 0
}

/*
 * The state change time to send, from one read of the live object (design D13), or null when none applies:
 * last_state_change once the state value has changed; otherwise, in state type HARD (1), last_hard_state_change,
 * the execution end of the first HARD result; otherwise null. Icinga 2's initial values of the two timestamps
 * (0, or the daemon's start time for an object created at runtime) are never returned. The chosen time is then
 * checked by correlia_time_text alone; an unusable one never falls through to the other timestamp.
 */
globals.correlia_state_change = function(target, changed) {
  if (target == null) {
    return null
  }
  if (changed) {
    return target.last_state_change
  }
  if (target.state_type == 1) {
    return target.last_hard_state_change
  }
  return null
}

globals.correlia_host_state_change = function(host) {
  if (host == null) {
    return null
  }
  return correlia_state_change(host, correlia_nonzero(host.last_state_up))
}

globals.correlia_service_state_change = function(service) {
  if (service == null) {
    return null
  }
  return correlia_state_change(service, correlia_nonzero(service.last_state_ok) ||
    correlia_nonzero(service.last_state_warning) || correlia_nonzero(service.last_state_critical))
}

/*
 * The --last-state-change argument is passed for PROBLEM and RECOVERY only: its set_if tests the notification
 * type, which is fixed for the command, so omission never depends on a second read of the timestamps.
 */
globals.correlia_is_state_notification = function(type) {
  return type == "PROBLEM" || type == "RECOVERY"
}
