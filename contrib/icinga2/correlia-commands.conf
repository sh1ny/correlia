/*
 * Correlia notification commands. Not edited by the operator; loaded by correlia.conf.
 *
 * The sender is started as `/usr/bin/env -i <sender>`, so it runs with an empty environment whatever Icinga 2's
 * own is. `timeout = 15` makes Icinga 2 stop a sender that is stuck; the sender's own deadline is 10 s.
 *
 * Every argument's value and set_if is a function written here. Inputs are read only through qualified macros
 * (macro("$host.name$") and so on), never an unqualified $name$, which Icinga 2 would resolve against custom
 * variables first. The check output and the state change time come from the live object
 * (get_service / get_host), not from $service.output$, which holds the triggering check result and can be
 * older than the state a delayed notification reports. The notification time is get_time(). The settings are
 * the constants of correlia.conf, read as plain values.
 *
 * Icinga 2 expands macros in every element of `command`, so the sender path goes through
 * correlia_command_path, which doubles each dollar sign: the macro processor turns "$$" back into one literal
 * dollar sign, and the path is run exactly as configured.
 *
 * The commands define no Notification and no User: see the commented example in correlia.conf.
 */

object NotificationCommand "correlia-service" {
  command = [ "/usr/bin/env", "-i", correlia_command_path(CorreliaSenderPath) ]
  timeout = 15

  arguments = {
    "--base-url" = {
      value = {{ correlia_base_url(CorreliaBaseUrl) }}
    }
    "--source" = {
      value = {{ correlia_source(CorreliaSource) }}
    }
    "--token-file" = {
      set_if = {{ CorreliaTokenFile != "" }}
      value = {{ correlia_exact(CorreliaTokenFile, CorreliaSettingLimit) }}
    }
    "--hmac-key-file" = {
      set_if = {{ CorreliaHmacKeyFile != "" }}
      value = {{ correlia_exact(CorreliaHmacKeyFile, CorreliaSettingLimit) }}
    }
    "--ca-file" = {
      set_if = {{ CorreliaCaFile != "" }}
      value = {{ correlia_exact(CorreliaCaFile, CorreliaSettingLimit) }}
    }
    "--object-type" = {
      value = "\"service\""
    }
    "--host" = {
      value = {{ correlia_exact(macro("$host.name$"), CorreliaNameLimit) }}
    }
    "--service" = {
      value = {{ correlia_exact(macro("$service.name$"), CorreliaNameLimit) }}
    }
    "--state" = {
      value = {{ correlia_exact(macro("$service.state$"), 32) }}
    }
    "--state-type" = {
      value = {{ correlia_exact(macro("$service.state_type$"), 32) }}
    }
    "--last-state-change" = {
      set_if = {{ correlia_is_state_notification(macro("$notification.type$")) }}
      value = {{
        correlia_time_literal(correlia_service_state_change(get_service(macro("$host.name$"), macro("$service.name$"))))
      }}
    }
    "--output" = {
      set_if = {{
        correlia_text(correlia_live_output(get_service(macro("$host.name$"), macro("$service.name$"))),
                      CorreliaTextLimit) != ""
      }}
      value = {{
        correlia_text(correlia_live_output(get_service(macro("$host.name$"), macro("$service.name$"))),
                      CorreliaTextLimit)
      }}
    }
    "--notification-type" = {
      value = {{ correlia_exact(macro("$notification.type$"), 32) }}
    }
    "--notification-author" = {
      set_if = {{ correlia_text(macro("$notification.author$"), CorreliaAuthorLimit) != "" }}
      value = {{ correlia_text(macro("$notification.author$"), CorreliaAuthorLimit) }}
    }
    "--notification-comment" = {
      set_if = {{ correlia_text(macro("$notification.comment$"), CorreliaTextLimit) != "" }}
      value = {{ correlia_text(macro("$notification.comment$"), CorreliaTextLimit) }}
    }
    "--notification-time" = {
      value = {{ correlia_time_literal(get_time()) }}
    }
  }
}

object NotificationCommand "correlia-host" {
  command = [ "/usr/bin/env", "-i", correlia_command_path(CorreliaSenderPath) ]
  timeout = 15

  arguments = {
    "--base-url" = {
      value = {{ correlia_base_url(CorreliaBaseUrl) }}
    }
    "--source" = {
      value = {{ correlia_source(CorreliaSource) }}
    }
    "--token-file" = {
      set_if = {{ CorreliaTokenFile != "" }}
      value = {{ correlia_exact(CorreliaTokenFile, CorreliaSettingLimit) }}
    }
    "--hmac-key-file" = {
      set_if = {{ CorreliaHmacKeyFile != "" }}
      value = {{ correlia_exact(CorreliaHmacKeyFile, CorreliaSettingLimit) }}
    }
    "--ca-file" = {
