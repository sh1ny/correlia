// Define CorreliaStreamApiPassword in a protected configuration fragment.
object ApiUser "correlia-stream" {
  password = CorreliaStreamApiPassword
  permissions = [
    "events/StateChange",
    "events/AcknowledgementSet",
    "events/AcknowledgementCleared",
    "events/DowntimeStarted",
    "events/DowntimeRemoved",
    "events/Flapping",
    "objects/query/Host",
    "objects/query/Service"
  ]
}
