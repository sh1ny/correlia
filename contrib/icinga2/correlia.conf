/*
 * Correlia sender settings for Icinga 2: THE FILE THE OPERATOR EDITS.
 *
 * Install this directory as /etc/icinga2/correlia/ (all three files together) and add one line to
 * /etc/icinga2/icinga2.conf:
 *
 *     include "correlia/correlia.conf"
 *
 * Do not copy the files into conf.d: Icinga 2 loads that directory in file-name order, and the commands need
 * these constants and the helper functions loaded first. This file includes the other two itself, after the
 * constants, so the order is fixed.
 *
 * The settings are global constants read by the argument functions as plain values, never through a macro, so
 * a dollar sign in a value is an ordinary character. One Icinga 2 instance feeds one Correlia source.
 */

/* Absolute path of the compiled sender (built by `mise run build:icinga2-notify`), without "=". */
const CorreliaSenderPath = "/usr/local/bin/correlia-icinga2-notify"

/*
 * Scheme and authority of Correlia, nothing else: no path, query, userinfo or fragment. The sender builds
 * <base url>/hooks/icinga2/<source> itself. A value that does not match
 * \Ahttps?://[A-Za-z0-9.:\[\]-]+\z is not delivered (the sender exits 2, naming --base-url).
 */
const CorreliaBaseUrl = "https://correlia.example.org"

/* The source id (lowercase UUID) of the Icinga 2 source in Correlia. */
const CorreliaSource = "00000000-0000-0000-0000-000000000000"

/*
 * Exactly one of the next two must be a non-empty absolute path; leave the other "". The token file holds the
 * bearer token, the key file Correlia's HMAC key (43 unpadded base64url characters). Only the path is ever an
 * argument, never the credential. The file must be readable only by the Icinga 2 user.
 */
const CorreliaTokenFile = ""
const CorreliaHmacKeyFile = ""

/*
 * CA bundle that verifies Correlia's TLS certificate. When set, it is the only trust: the distribution's bundle is
 * not used. "" uses the distribution's bundle.
 */
const CorreliaCaFile = ""

include "correlia-functions.conf"
include "correlia-commands.conf"

/*
 * Example only, deliberately commented out: apply the notification to one dedicated Correlia user (Icinga 2 runs
 * the command once per recipient, so more users mean more events). Define the User and fill in the filters
 * for your site first.
 *
 * object User "correlia" {
 *   email = "correlia@localhost"
 *   states = [ OK, Warning, Critical, Unknown, Up, Down ]
 *   types = [ Problem, Recovery, Acknowledgement, DowntimeStart, DowntimeEnd, DowntimeRemoved,
 *             FlappingStart, FlappingEnd, Custom ]
 * }
 *
 * apply Notification "correlia-service" to Service {
 *   command = "correlia-service"
 *   users = [ "correlia" ]
 *   assign where true
 * }
 *
 * apply Notification "correlia-host" to Host {
 *   command = "correlia-host"
 *   users = [ "correlia" ]
 *   assign where true
 * }
 */
