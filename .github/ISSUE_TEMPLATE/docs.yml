name: Docs problem
description: A page in Correlia's docs is wrong, unclear or missing.
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. Only the first box is required.
  - type: textarea
    id: docs
    attributes:
      label: Affected docs
      description: The page's URL or path, or "missing" if the page doesn't exist yet, and what's wrong or missing on it.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: Optional. Version, OS, and the exact command or error, if it's about one.
