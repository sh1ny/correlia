name: correlia_server
description: Correlia server (ingestion, correlation and incident API) on Serverpod.
# version: 1.0.0
# homepage: https://www.example.com

environment:
  sdk: '^3.12.2'

resolution: workspace

dependencies:
  args: ^2.7.0
  crypto: 3.0.8
  ffi: 2.2.0
  fixnum: 1.1.1
  grpc: 5.2.0
  http2: 2.3.1
  protobuf: 6.1.0
  relic_core: 2.0.0-rc.2
  serverpod: 4.1.0
  uuid: 4.6.0

dev_dependencies:
  correlia_client:
    path: ../correlia_client
  lints: '>=3.0.0 <7.0.0'
  path: ^1.9.0
  postgres: 3.5.20
  protoc_plugin: 25.1.0
  serverpod_cli: 4.1.0
  serverpod_test: 4.1.0
  test: ^1.25.5

serverpod:
  scripts:
    # Build the Flutter web app and copy it to the server's web directory.
    # On failure, clean and retry once to clear stale Flutter build caches.
    flutter_build:
      posix: |
        rm -rf ../correlia_server/web/app
        cd ../correlia_flutter
        set -- web --base-href / --output ../correlia_server/web/app
        flutter build "$@" || { flutter clean && flutter build "$@"; }

  # Companion Flutter apps that `serverpod start` can launch (Ctrl+R), keyed
  # by a display alias. The default device is the web server, opening the
  # machine's default browser when ready. All non-reserved properties are
  # forwarded to `flutter run`. For the best IDE debugging experience, use
  # `chrome` or a native target as the device. See the example below:
  #
  # Admin:
  #   path: ../apps/admin_flutter
  #   displayName: "Admin app"
  #   auto_launch: true
  #   device: chrome
  #   target: lib/main.dart
  #   web-hostname: 0.0.0.0
  #   web-port: 8090
  #   release: true
  #   pub: false
  #   dart-define:
  #     API_URL=https://admin.example.com
  #     FLAVOR=production
  flutter_apps:
    correlia:
      path: ../correlia_flutter
      displayName: "Correlia app"
      auto_launch: true
      target: lib/driver.dart
