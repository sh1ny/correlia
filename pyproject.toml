[project]
name = "correlia"
version = "0.1.0"
description = "API-first event aggregation system for infrastructure alerts."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.1",
    "alembic",
    "asyncpg",
    "fastapi",
    "prometheus-client>=0.25.0",
    "pydantic",
    "pydantic-settings",
    "PyYAML",
    "SQLAlchemy",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "testcontainers",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py314"

[tool.mypy]
python_version = "3.14"
files = ["app"]
strict = true
