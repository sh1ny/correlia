# Unsupported: tag key not convertible to topology.*
rules:
  - name: "Bad Tag Key Rule"
    priority: 100
    match:
      severity: ["CRITICAL"]
      tags:
        "Bad Key": ".+"
    window:
      duration_seconds: 1800
      group_by: ["host"]
      trigger_threshold: 1
    output_summary: "Bad tag key"
    actions: ["email-ops"]
